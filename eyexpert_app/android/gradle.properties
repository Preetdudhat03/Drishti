org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
android.enableR8.fullMode=false

# Disable Kotlin incremental compilation across different Windows drives (P: project vs C: Pub cache)
kotlin.incremental=false
kotlin.incremental.jvm=false
kotlin.incremental.js=false
kotlin.incremental.android=false
