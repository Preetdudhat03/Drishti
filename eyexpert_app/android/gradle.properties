org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
android.enableR8.fullMode=false

# Disable Kotlin incremental compilation across different Windows drives (P: project vs C: Pub cache)
kotlin.incremental=false
kotlin.incremental.jvm=false
kotlin.incremental.js=false
kotlin.incremental.android=false
