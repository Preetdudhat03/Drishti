org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:CICompilerCount=2 -XX:+UseG1GC
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
android.enableR8.fullMode=false

# Disable Kotlin incremental compilation across different Windows drives (P: project vs C: Pub cache)
kotlin.incremental=false
kotlin.incremental.jvm=false
kotlin.incremental.js=false
kotlin.incremental.android=false
